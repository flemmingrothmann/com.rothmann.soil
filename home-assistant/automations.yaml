# Blueprint instances live here so Home Assistant can edit them from the UI.
- id: loftlys_flemmings_kontor_altid_fuld_styrke
  alias: Loftlys Flemmings Kontor altid fuld styrke
  description: >-
    Retter lysstyrken til 100 %, når lyset er tændt, fordi lyskilden ikke er
    dæmpbar. Tænder aldrig et slukket lys. Kan ikke forhindre kortvarig dæmpning.
  triggers:
    - trigger: state
      entity_id: light.0xdc8e95fffef23aec
      to: "on"
    - trigger: state
      entity_id: light.0xdc8e95fffef23aec
      attribute: brightness
    - trigger: homeassistant
      event: start
  conditions:
    - condition: state
      entity_id: light.0xdc8e95fffef23aec
      state: "on"
    - condition: template
      value_template: >-
        {{ state_attr('light.0xdc8e95fffef23aec', 'brightness') != 255 }}
  actions:
    - action: light.turn_on
      target:
        entity_id: light.0xdc8e95fffef23aec
      data:
        brightness_pct: 100
        transition: 0
  mode: single
- id: sovevaerelse_skab_led_driver_always_on
  alias: Soveværelse skab LED-driver altid tændt
  description: >-
    Holder LED-driveren tændt, så de analoge sensorer i LED-lyset altid har strøm.
  triggers:
    - trigger: state
      entity_id: switch.sovevaerelse_skab_led_driver
      to: "off"
    - trigger: homeassistant
      event: start
  conditions:
    - condition: state
      entity_id: switch.sovevaerelse_skab_led_driver
      state: "off"
  actions:
    - action: switch.turn_on
      target:
        entity_id: switch.sovevaerelse_skab_led_driver
  mode: single
- id: manuel_vanding_push_notifikation
  alias: Manuel vanding push til mobilapps
  description: >-
    Sender manuelle vandingsalarmer højst én gang pr. 24 timer pr. sensor.
    Seneste push gemmes i en dato/tid-helper og bevares ved genstart.
    Tilføj nye mobilapps til listen over handlinger ved tilknytning.
  triggers:
    - trigger: persistent_notification
      update_type:
        - added
        - updated
  conditions:
    - condition: template
      value_template: >-
        {{ trigger.notification.notification_id.startswith('manual_soil_alarm_') }}
  actions:
    - variables:
        last_push_helper: "input_datetime.{{ trigger.notification.notification_id }}_last_push"
    - condition: template
      value_template: >-
        {{ states(last_push_helper) not in ['unknown', 'unavailable'] and
           as_timestamp(now()) - as_timestamp(states(last_push_helper), 0) >= 86400 }}
    - action: input_datetime.set_datetime
      target:
        entity_id: "{{ last_push_helper }}"
      data:
        timestamp: "{{ as_timestamp(now()) | round(0, 'ceil') | int }}"
    - action: notify.mobile_app_flemmings_s23
      continue_on_error: true
      data:
        title: "{{ trigger.notification.title }}"
        message: "{{ trigger.notification.message }}"
        data:
          tag: "{{ trigger.notification.notification_id }}"
  mode: queued
  max: 10
- id: myggeplante_soil_moisture_alarm
  alias: Myggeplante jordfugt alarm
