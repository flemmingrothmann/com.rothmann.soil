services:
  home-assistant:
    image: ghcr.io/home-assistant/home-assistant:stable
    container_name: home-assistant
    restart: unless-stopped
    network_mode: host
    privileged: true
    environment:
      TZ: Europe/Copenhagen
    volumes:
      - home-assistant-config:/config
      - /run/dbus:/run/dbus:ro

volumes:
  home-assistant-config:
