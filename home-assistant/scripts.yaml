# Scripts live here so they remain editable in the Home Assistant UI.
julelys_sluk:
  alias: Julelys sluk inde og ude
  description: Fælles labelbaseret sluk. Den manuelle kontakt følger lysets faktiske status.
  mode: queued
  sequence:
    - action: light.turn_off
      target:
        label_id:
          - julelys
          - julelys_ude
          - julelys_inde

ha_watering_capacity_acquire:
  alias: Reserver HA vandingskapacitet
  mode: queued
  max: 100
  sequence:
    - wait_template: "{{ is_state('input_boolean.ha_watering_capacity_busy', 'off') }}"
    - action: input_boolean.turn_on
      target:
        entity_id: input_boolean.ha_watering_capacity_busy
