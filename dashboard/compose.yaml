services:
  soil-dashboard:
    build: .
    container_name: soil-dashboard
    restart: unless-stopped
    expose:
      - "8787"
    networks:
      - reverse-proxy
    volumes:
      - soil-dashboard-data:/data
    environment:
      HOMEY_URL: ${HOMEY_URL:-http://192.168.100.45}
      HOMEY_TOKEN: ${HOMEY_TOKEN}
      WINGMAN_URL: ${WINGMAN_URL:-http://homey-wingman-ingest-service:8788}
      HOMEY_APP_ID: com.rothmann.soil
      DASHBOARD_PASSWORD: ${DASHBOARD_PASSWORD:-Bogfinkevej11}
      WATERING_FORBIDDEN_VARIABLE_ID: ${WATERING_FORBIDDEN_VARIABLE_ID:-5a2a34fd-8d2f-4c7d-b076-b1bb41e3a41f}

volumes:
  soil-dashboard-data:

networks:
  reverse-proxy:
    external: true
