<!doctype html>
<html lang="da">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script type="text/javascript" src="/homey.js" data-origin="settings"></script>
    <style>
      :root {
        color-scheme: light;
        --soil: #4c7a45;
        --soil-dark: #2e4b2a;
        --dry: #c94b32;
        --muted: #667085;
        --line: #d8dfd3;
        --background: #f3f6ef;
      }

      * { box-sizing: border-box; }

      body {
        background: radial-gradient(circle at top left, #eef8df, var(--background) 38%, #edf2f7);
        color: #172016;
        font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        margin: 0;
        padding: 24px;
      }

      h1, p { margin: 0; }

      h1 {
        color: var(--soil-dark);
        font-size: clamp(28px, 7vw, 46px);
        line-height: 1;
      }

      .subtitle {
        color: var(--muted);
        margin-top: 8px;
      }

      .panel {
        background: rgba(255, 255, 255, 0.9);
        border: 1px solid rgba(76, 122, 69, 0.18);
        border-radius: 22px;
        box-shadow: 0 18px 50px rgba(46, 75, 42, 0.12);
        margin-top: 24px;
        max-width: 520px;
        padding: 18px;
      }

      .mode-card {
        align-items: center;
        cursor: pointer;
        display: flex;
        gap: 16px;
        justify-content: space-between;
      }

      .mode-card.forbidden {
        background: linear-gradient(145deg, #ffe0d6, #fff5f0 62%, rgba(255, 255, 255, 0.96));
        border-color: rgba(201, 75, 50, 0.62);
      }

      .mode-title {
        color: var(--soil-dark);
        display: block;
        font-size: 22px;
        font-weight: 900;
      }

      .mode-card.forbidden .mode-title { color: var(--dry); }

      .mode-button {
        appearance: none;
        background: transparent;
        border: 0;
        display: block;
        height: 0;
        margin: 0;
        opacity: 0;
        overflow: hidden;
        padding: 0;
        width: 0;
      }

      .switch-track {
        background: rgba(76, 122, 69, 0.22);
        border-radius: 999px;
        display: block;
        flex: 0 0 auto;
        height: 32px;
        position: relative;
        width: 62px;
      }

      .switch-thumb {
        background: var(--soil);
        border-radius: 50%;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.18);
        display: block;
        height: 26px;
        left: 3px;
        position: absolute;
        top: 50%;
        transform: translate(30px, -50%);
        transition: transform 160ms ease, background 160ms ease;
        width: 26px;
      }

      .mode-card.forbidden .switch-track { background: rgba(201, 75, 50, 0.24); }
      .mode-card.forbidden .switch-thumb { background: var(--dry); transform: translate(0, -50%); }

      .note {
        border-top: 1px solid var(--line);
        color: var(--muted);
        margin-top: 18px;
        padding-top: 18px;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Jordsensorer</h1>
      <p class="subtitle">Dashboardet vises nu i web-dashboardet via Wingman DB.</p>
    </header>

    <main class="panel">
      <section id="watering-mode-card" class="mode-card" role="button" tabindex="0">
        <div>
          <strong id="watering-mode-title" class="mode-title">Henter...</strong>
          <p class="subtitle">Klik for at skifte vandingstilstand.</p>
        </div>
        <span class="switch-track" aria-hidden="true"><span class="switch-thumb"></span></span>
        <button id="watering-mode-toggle" class="mode-button" type="button" aria-pressed="false">Skift</button>
      </section>
      <p class="note">Sensorstatus, alarmer, historik og zoner er flyttet ud af Homey-appen og læses fra Wingman på hjemmeserveren.</p>
    </main>

    <script type="text/javascript">
      function renderWateringMode(state) {
        var card = document.getElementById('watering-mode-card');
        var title = document.getElementById('watering-mode-title');
        var button = document.getElementById('watering-mode-toggle');

        card.classList.toggle('forbidden', state.wateringForbidden === true);
        button.setAttribute('aria-pressed', state.wateringForbidden ? 'true' : 'false');
        title.textContent = state.wateringForbidden ? 'Vanding forbudt' : 'Vanding tilladt';
        button.setAttribute('aria-label', state.wateringForbidden ? 'Slå vanding tilladt til' : 'Slå vanding forbudt til');
      }

      function loadWateringMode(Homey) {
        Homey.api('GET', '/watering-mode', null, function (err, result) {
          if (err) {
            document.getElementById('watering-mode-title').textContent = 'Kunne ikke hente vandingstilstand';
            document.getElementById('watering-mode-toggle').disabled = true;
            return;
          }
          renderWateringMode(result);
        });
      }

      function toggleWateringMode(Homey) {
        var button = document.getElementById('watering-mode-toggle');
        button.disabled = true;
        Homey.api('POST', '/watering-mode/toggle', null, function (err, result) {
          button.disabled = false;
          if (err) return Homey.alert('Kunne ikke ændre Vanding Forbudt: ' + (err.message || err));
          renderWateringMode(result);
        });
      }

      function onHomeyReady(Homey) {
        var card = document.getElementById('watering-mode-card');
        card.addEventListener('click', function () {
          if (document.getElementById('watering-mode-toggle').disabled) return;
          toggleWateringMode(Homey);
        });
        card.addEventListener('keydown', function (event) {
          if (event.key !== 'Enter' && event.key !== ' ') return;
          event.preventDefault();
          if (document.getElementById('watering-mode-toggle').disabled) return;
          toggleWateringMode(Homey);
        });

        loadWateringMode(Homey);
        Homey.ready();
      }
    </script>
  </body>
</html>
